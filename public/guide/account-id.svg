<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title"><title id="title">Account ID в адресе домашней страницы Cloudflare — схема</title><rect width="1000" height="280" rx="14" fill="#f8f5ef"/><g font-family="Arial,sans-serif" fill="#302d28"><text x="32" y="42" font-size="20" font-weight="bold">1. Скопируйте всю ссылку из адресной строки</text><rect x="32" y="67" width="936" height="70" rx="10" fill="white" stroke="#b8ad9d"/><rect x="393" y="82" width="434" height="39" rx="4" fill="#fbe5a6"/><text x="49" y="108" font-size="22" font-family="monospace" textLength="350" lengthAdjust="spacingAndGlyphs">https://dash.cloudflare.com/</text><text x="399" y="108" font-size="22" font-family="monospace" textLength="422" lengthAdjust="spacingAndGlyphs">0123456789abcdef0123456789abcdef</text><text x="821" y="108" font-size="22" font-family="monospace">/home</text><path d="M585 144v28" stroke="#9c731f" stroke-width="2"/><text x="390" y="198" font-size="20" font-weight="bold">Account ID — 32 символа</text><text x="32" y="240" font-size="18">Вставьте ссылку целиком в Detective Board. ID с многоточием не подходит.</text><text x="32" y="265" font-size="14" fill="#777">Учебная схема. Здесь вымышленный ID, а не данные вашего аккаунта.</text></g></svg>